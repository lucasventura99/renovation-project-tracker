name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: renovation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Migrations
      env:
        # Ensure Alembic uses the service DB
        DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/renovation_test
        PROJECT_NAME: "Renovation Tracker CI"
        SECRET_KEY: "super-secret-ci-key"
      run: |
        # Overwrite alembic.ini url for CI execution if env vars aren't hooked up in env.py
        sed -i 's|sqlalchemy.url = .*|sqlalchemy.url = postgresql+asyncpg://postgres:password@localhost:5432/renovation_test|' alembic.ini
        alembic upgrade head

    - name: Run Tests
      env:
        DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/renovation_test
        PROJECT_NAME: "Renovation Tracker CI"
        SECRET_KEY: "super-secret-ci-key"
      run: |
        pytest