services:
  web:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    # FIX: This tells Docker to load variables from your local .env file
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # FIX: We can also use the .env for the database credentials
    env_file:
      - .env
    ports:
      - "5432:5432"

volumes:
  postgres_data: